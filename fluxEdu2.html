<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{

display: grid;
grid-template-columns:600px ;
grid-template-rows: 100px 100px 100px 100px 100px;
text-align: center;
align-items: center;
padding: 20px;
gap: 10px;
margin-top: 200px;
row-gap:5px;
margin-left:350px;


}

img{

width: 80vw;  
height: 90vh;
margin-left: 100px;
}

h1{
color:green;
margin-left: 200px;
font-size:50px;
margin-top: 150px;


}

.sistema{
display: grid;
grid-template-columns:300px ;
grid-template-rows: 100px 100px 100px 100px;
text-align: center;
align-items: center;
padding:10px;
gap: 5px;
row-gap: 10px;
margin-left:100px;



}

input{
width: 40vw;
height: 30px;
margin-left: 120px;
border-radius:10px ;

}

.btn{
height:40px;
border-radius: 10px;
width: 10vw;
color: whitesmoke;

margin-left: 200px;  
background-color: darkgreen;

}

.btn a{

text-decoration: none;

color: white;
}

.btn:hover{
transform: scale(0.9);

}

#do{
margin-top: 600px;
margin-left: 114px;
}

#nome{
margin-top: 250px;
}

#fluxEdu{
margin-top:200px ;
}

h3{
color: black;
display: flex;
justify-content: space-between;


}








    

/* Ajustes responsivos: preservam a estrutura e o estilo original */
*, *::before, *::after { box-sizing: border-box; }
html { max-width: 100%; overflow-x: hidden; }
body { margin: 0; max-width: 100%; }
.container { width: 100%; max-width: 100%; }
img { max-width: 100%; height: auto; }
input { max-width: 100%; }

@media (max-width: 900px) {
  .container { margin-left: auto; margin-right: auto; margin-top: 80px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; justify-items: center; gap: 14px; padding: 20px; }
  img { width: min(70vw, 420px); height: auto; max-height: 35vh; object-fit: contain; }
  h1 { margin: 10px 0 18px; font-size: clamp(34px, 6vw, 50px); }
  .sistema { width: 100%; max-width: 560px; margin-left: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; justify-items: stretch; gap: 12px; padding: 10px; }
  #do { margin-top: 0; }
  #nome { margin-top: 0; }
  #fluxEdu { margin-top: 0; }
  input { width: 100%; height: 40px; margin-right: 0; }
  .btn { width: min(180px, 100%); margin-left: 0; justify-self: center; min-height: 40px; }
  h3 { display: block; text-align: center; }
}

@media (max-width: 600px) {
  .container { margin-top: 28px; padding: 14px; gap: 10px; }
  img { width: min(78vw, 320px); max-height: 28vh; }
  h1 { font-size: 36px; margin: 6px 0 14px; }
  .sistema { padding: 4px; gap: 10px; }
  h3 { font-size: 19px; }
  input { font-size: 16px; }
  .btn { width: 100%; max-width: 220px; }
}

</style>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    
    <div class="container">

        <img src="imagem.png" alt="">

            <h1 id="fluxedu">FluxEdu</h1>

            <section class="sistema">

                <h3 id="do" class="do">Cadastro da instituição</h3> <br>
    
            <input type="text" placeholder="digite o nome da instituição" id="nome"> <br>
     
            <input type="text" placeholder="digite a localização da instituição "> <br>
    
            <input type="email" placeholder="digite o email"><br>
    
           
    
            <button class="btn"><a href="fluxEdu3.html">Entrar</a></button>
           
            </section>
    </div>
    

</body>
</html>
